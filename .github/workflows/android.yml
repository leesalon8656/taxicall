name: Build Taxi Call Hunter APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          mkdir source
          unzip -q Taxi_Call_Hunter_Auto_Recorder_Android_Source.zip -d source
      - name: Fix accessibility description
        run: |
          mkdir -p source/TaxiCallHunterAutoRecorder/app/src/main/res/values
          cat > source/TaxiCallHunterAutoRecorder/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="accessibility_service_description">카카오T 기사 콜 화면의 수락 버튼을 감지해 발생 시각과 GPS 위치를 기록합니다.</string>
          </resources>
          EOF
              sed -i 's|android:description=".*"|android:description="@string/accessibility_service_description"|' source/TaxiCallHunterAutoRecorder/app/src/main/res/xml/accessibility_config.xml
      - name: Build APK
        run: |
          cd source/TaxiCallHunterAutoRecorder
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Call-Hunter-APK
          path: source/TaxiCallHunterAutoRecorder/app/build/outputs/apk/debug/*.apk
